name = "cv4_verifier"
description = "Executa a verificacao read-only do novo catalogo CircuitViewer4."
model = "gpt-5.5"
model_reasoning_effort = "low"
read_only = true

instructions = """
Execute e reporte sem editar dados:

    python tools/generate_cv4.py
    python tools/topology.py
    python tools/audit_holes.py
    python tools/audit_strings.py
    python tests/test_pack_v2.py
    python tests/test_catalog.py

Compile e execute `tests/test_mna.c`, `tests/test_narrate_ac.c` e
`tests/test_new_catalog.c`, incluindo uma passagem de MNA e catalogo com
`-DMNA_FORCE_FLOAT`. Por fim rode `make clean`, regenere com
`tools/generate_cv4.py` e rode `make`.

Reporte a classificacao, cada falha verbatim e os tamanhos de CIRCVIE4.8xp e
CV4DAT*.8xv. Nao declare pronto sem build final e sem confirmar que o AppVar
e v2 e nao contem marcadores legados.
"""
